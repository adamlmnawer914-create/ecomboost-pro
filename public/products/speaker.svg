<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <rect width="400" height="400" rx="20" fill="#16161f"/>
  <ellipse cx="200" cy="345" rx="80" ry="12" fill="#111118"/>
  <!-- Speaker body -->
  <rect x="130" y="120" width="140" height="200" rx="70" fill="#1c1c28" stroke="#c8a548" stroke-width="2.5"/>
  <!-- Speaker grille -->
  <circle cx="200" cy="200" r="50" fill="#22222e" stroke="#2a2a38" stroke-width="1.5"/>
  <circle cx="200" cy="200" r="35" fill="#111118" stroke="#2a2a38" stroke-width="1"/>
  <circle cx="200" cy="200" r="20" fill="#1c1c28" stroke="#c8a548" stroke-width="1.5"/>
  <circle cx="200" cy="200" r="8" fill="#c8a548"/>
  <!-- Grille lines -->
  <line x1="200" y1="150" x2="200" y2="250" stroke="#2a2a38" stroke-width="0.5" opacity="0.5"/>
  <line x1="150" y1="200" x2="250" y2="200" stroke="#2a2a38" stroke-width="0.5" opacity="0.5"/>
  <!-- Top detail -->
  <circle cx="200" cy="140" r="4" fill="#c8a548" opacity="0.6"/>
  <!-- Bottom buttons -->
  <circle cx="185" cy="280" r="5" fill="#22222e" stroke="#2a2a38" stroke-width="1"/>
  <circle cx="200" cy="285" r="7" fill="#c8a548" opacity="0.8"/>
  <circle cx="215" cy="280" r="5" fill="#22222e" stroke="#2a2a38" stroke-width="1"/>
  <!-- Sound waves -->
  <path d="M280 170 Q300 200 280 230" stroke="#c8a548" stroke-width="1.5" fill="none" opacity="0.3"/>
  <path d="M295 155 Q320 200 295 245" stroke="#c8a548" stroke-width="1.5" fill="none" opacity="0.2"/>
</svg>
